
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6654a3">
<title>劑量計算小幫手</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 14px 30px;background:#f5f3fa;color:#292638;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:auto}
header{text-align:center;margin:12px 0 20px}
h1{font-size:25px;color:#4e3c85;margin:0 0 6px}
.sub{font-size:13px;color:#777}
.panel{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px #33205b12}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:18px}
button{font:inherit;border:0;cursor:pointer}
.tab{padding:12px 4px;border-radius:11px;background:#f0edf7;color:#574b76;font-size:13px;font-weight:700}
.tab.active{background:#6654a3;color:white}
label{display:block;font-size:14px;font-weight:650;margin:13px 0 6px}
input{width:100%;padding:14px 12px;border:1px solid #d9d4e5;border-radius:12px;font-size:18px}
input:focus{outline:2px solid #a99bd2}
.hint{font-size:12px;color:#817b8d;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.primary,.secondary{padding:14px;border-radius:12px;font-size:16px;font-weight:700}
.primary{background:#6654a3;color:white}
.secondary{background:#efedf4;color:#554b6c}
.result{display:none;background:#f2effa;border-radius:14px;padding:16px;margin-top:16px}
.answer{font-size:29px;font-weight:800;color:#4e3c85;margin:7px 0}
.detail{font-size:13px;color:#655d74;line-height:1.6}
.error{display:none;color:#b42318;font-size:13px;margin-top:10px}
.warning{font-size:12px;line-height:1.7;color:#6f687b}
.warning strong{color:#9b3e35}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
<h1>劑量計算小幫手</h1>
<div class="sub">簡單輸入，快速計算藥物稀釋量</div>
</header>

<section class="panel">
<div class="tabs">
<button class="tab active" data-mode="powder" type="button">粉劑稀釋</button>
<button class="tab" data-mode="percc" type="button">每 cc 含量</button>
<button class="tab" data-mode="concentration" type="button">已知濃度</button>
</div>

<div id="powderFields">
<label for="totalDose">藥瓶總劑量（mg）</label>
<input id="totalDose" type="number" inputmode="decimal" placeholder="例如：1500">
<label for="dose1">醫囑給藥劑量（mg）</label>
<input id="dose1" type="number" inputmode="decimal" placeholder="例如：700">
<label for="finalVolume">預稀釋量（mL）</label>
<input id="finalVolume" type="number" inputmode="decimal" placeholder="例如：5">
<div class="hint">請輸入藥品實際稀釋完成後的總體積。</div>
</div>

<div id="perccFields" hidden>
<label for="mgPerCc">每 1 cc 含量（mg/cc）</label>
<input id="mgPerCc" type="number" inputmode="decimal" placeholder="例如：5">
<label for="dose3">醫囑給藥劑量（mg）</label>
<input id="dose3" type="number" inputmode="decimal" placeholder="例如：4.5">
</div>

<div id="concentrationFields" hidden>
<label for="mgPerMl">藥液濃度（mg/mL）</label>
<input id="mgPerMl" type="number" inputmode="decimal" placeholder="例如：250">
<label for="dose2">醫囑給藥劑量（mg）</label>
<input id="dose2" type="number" inputmode="decimal" placeholder="例如：500">
</div>

<div class="actions">
<button class="primary" id="calculate" type="button">計算抽取量</button>
<button class="secondary" id="clear" type="button">清除重填</button>
</div>

<div class="error" id="error" role="alert"></div>
<div class="result" id="result" aria-live="polite">
<small>計算結果</small>
<div class="answer" id="answer"></div>
<div class="detail" id="detail"></div>
</div>
</section>

<section class="panel warning">
<strong>用藥安全提醒</strong><br>
本工具僅供計算輔助，不能取代醫囑、藥品仿單及院內規範。計算前請再次確認藥名、劑量、單位、稀釋方式、稀釋後實際總體積、給藥途徑及藥品濃度。
</section>
</main>

<script>
(function(){
let mode="powder";
const $=id=>document.getElementById(id);
const tabs=[...document.querySelectorAll(".tab")];

function hideResult(){
$("result").style.display="none";
$("error").style.display="none";
$("error").textContent="";
}
function switchMode(next){
mode=next;
tabs.forEach(t=>t.classList.toggle("active",t.dataset.mode===mode));
$("powderFields").hidden=mode!=="powder";
$("concentrationFields").hidden=mode!=="concentration";
$("perccFields").hidden=mode!=="percc";
hideResult();
}
function number(id,label){
const raw=$(id).value.trim();
const value=Number(raw);
if(raw===""||!Number.isFinite(value)||value<=0)
throw new Error("請輸入有效的「"+label+"」，數值必須大於 0。");
return value;
}
function fmt(n){return Number(n.toFixed(4)).toString();}

function calculate(){
hideResult();
try{
let volume,explanation,dose;
if(mode==="powder"){
const total=number("totalDose","藥瓶總劑量");
const finalVol=number("finalVolume","稀釋後總體積");
dose=number("dose1","醫囑給藥劑量");
if(dose>total)throw new Error("給藥劑量不可大於藥瓶總劑量，請確認輸入及醫囑。");
const concentration=total/finalVol;
volume=dose/concentration;
explanation="換算濃度："+fmt(total)+" mg ÷ "+fmt(finalVol)+" mL = "+fmt(concentration)+" mg/mL";
}else if(mode==="concentration"){
const concentration=number("mgPerMl","藥液濃度");
dose=number("dose2","醫囑給藥劑量");
volume=dose/concentration;
explanation="抽取量："+fmt(dose)+" mg ÷ "+fmt(concentration)+" mg/mL";
}else{
const concentration=number("mgPerCc","每 cc 含量");
dose=number("dose3","醫囑給藥劑量");
volume=dose/concentration;
explanation="抽取量："+fmt(dose)+" mg ÷ "+fmt(concentration)+" mg/cc";
}
if(!Number.isFinite(volume)||volume<=0)throw new Error("無法計算，請重新確認輸入數值。");
$("answer").textContent=fmt(volume)+" mL（cc）";
$("detail").textContent=explanation+" = "+fmt(volume)+" mL。1 mL = 1 cc。";
$("result").style.display="block";
}catch(err){
$("error").textContent=err.message;
$("error").style.display="block";
}
}
tabs.forEach(t=>t.addEventListener("click",()=>switchMode(t.dataset.mode)));
$("calculate").addEventListener("click",calculate);
$("clear").addEventListener("click",()=>{
document.querySelectorAll("input").forEach(i=>i.value="");
hideResult();
});
})();
</script>
</body>
</html>
